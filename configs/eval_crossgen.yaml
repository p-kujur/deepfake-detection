# M3 cross-generator + robustness eval
model:
  id: unifd-clip-vit-l14-linear
  backbone: ViT-L-14
  pretrained: openai
  backend: open_clip
  image_size: 224
  npr_image_size: 128
  threshold: 0.5

data:
  root: datasets/crossgen
  packs: [progan_holdout, hemg_wild]
  max_per_class: null

robustness:
  jpeg_quality: 70
  resize_short: 128

fusion:
  weight_unifd: 0.5

notes: >
  Cross-gen packs: ProGAN-Eval (GAN family) and Hemg wild AI-art (Midjourney-style).
  Default packs for ProGAN-trained probe: in-domain holdout + Hemg cross-gen. Use progan_eval for legacy M3 CIFAKE-probe comparison.
