<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deepfake / AI image detector</title>
  <meta name="description" content="Check whether a still image looks AI-generated. CLIP ViT-L/14 + linear probe, running on a Hugging Face Space." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>AI image detector</h1>
      <p class="sub">Upload a still image to get a <code>p_fake</code> score from a frozen CLIP ViT-L/14 + linear probe.</p>
    </header>

    <section class="card">
      <label id="drop" class="drop" for="file">
        <input id="file" type="file" accept="image/*" hidden />
        <img id="preview" alt="" hidden />
        <span id="dropText">Tap to choose an image<br /><small>or drag one here</small></span>
      </label>

      <div class="row">
        <label for="model" class="lbl">Model</label>
        <select id="model">
          <option value="none">Default (ProGAN probe)</option>
          <option value="soft_router">soft_router (ProGAN + CIFAKE)</option>
        </select>
      </div>

      <button id="run" class="btn" disabled>Detect</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="result" class="card" hidden>
      <div class="verdict">
        <span id="label" class="pill"></span>
        <span id="pct" class="pct"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="fill" class="fill"></div>
      </div>
      <div class="scale"><span>real</span><span>0.5 threshold</span><span>fake</span></div>
      <dl class="meta">
        <dt>model_id</dt><dd id="modelId"></dd>
        <dt>version</dt><dd id="version"></dd>
      </dl>
      <p id="notes" class="notes"></p>
    </section>

    <footer>
      <p>Experimental score, not court-grade evidence. Often misses modern generators (Midjourney / SDXL / Flux).</p>
      <p>
        <a href="https://github.com/p-kujur/deepfake-detection" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://huggingface.co/spaces/ezra9426/deepfake-detector" target="_blank" rel="noopener">Hugging Face Space</a>
      </p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
