<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI image detector</title>
  <meta name="description" content="Check whether a still image looks AI-generated." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;550;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="wrap">
    <header>
      <h1>AI image detector</h1>
    </header>

    <section class="card">
      <label id="drop" class="drop" for="file">
        <input id="file" type="file" accept="image/*" hidden />
        <img id="preview" alt="Selected image preview" hidden />
        <span id="dropText" class="drop-text">
          Drop an image here
          <small>or tap to choose one</small>
        </span>
      </label>

      <button id="run" class="btn" disabled>Detect</button>
      <p id="status" class="status" aria-live="polite"></p>

      <section id="result" class="result" hidden>
        <p id="label" class="verdict"></p>
        <p id="pct" class="pct"></p>
        <div class="bar" role="progressbar" aria-label="Likelihood the image is AI-generated" aria-valuemin="0" aria-valuemax="100">
          <div id="fill" class="fill"></div>
        </div>
        <div class="scale"><span>Real</span><span>Fake</span></div>
      </section>

      <details class="details">
        <summary>Details</summary>
        <div class="details-body">
          <div class="row">
            <label for="model" class="lbl">Model</label>
            <select id="model">
              <option value="none">Default</option>
              <option value="progan">ProGAN</option>
              <option value="soft_router">soft_router</option>
            </select>
          </div>
          <dl id="meta" class="meta" hidden>
            <dt>Score</dt><dd id="rawScore"></dd>
            <dt>Model id</dt><dd id="modelId"></dd>
            <dt>Version</dt><dd id="version"></dd>
          </dl>
        </div>
      </details>
    </section>

    <p class="caveat">Results can be wrong; real photos and illustrations are sometimes flagged.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
